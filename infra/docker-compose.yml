# docker-compose.yml — Smart Room & Financial Monitoring System
# ═══════════════════════════════════════════════════════════════
# Stack complète de développement / staging.
# Production : utiliser les manifests Kubernetes dans /infra/kubernetes/
#
# Usage:
#   cp .env.example .env && vim .env
#   docker compose up -d
#   docker compose logs -f backend
#
# Accès:
#   Frontend   → http://localhost:3000
#   Backend    → http://localhost:8000/docs
#   ML Service → http://localhost:8001/docs
#   InfluxDB   → http://localhost:8086
#   Grafana    → http://localhost:3001 (admin/admin)
#   MLflow     → http://localhost:5000
#   Kibana     → http://localhost:5601

version: "3.9"

# ─── Réseaux ──────────────────────────────────────────────────
networks:
  smart_room_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24

# ─── Volumes persistants ──────────────────────────────────────
volumes:
  postgres_data:
  influxdb_data:
  influxdb_config:
  redis_data:
  mosquitto_data:
  mosquitto_log:
  grafana_data:
  prometheus_data:
  elasticsearch_data:
  mlflow_data:
  ml_models:

# ═════════════════════════════════════════════════════════════
#  SERVICES
# ═════════════════════════════════════════════════════════════

services:

  # ── Base de données PostgreSQL ────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: smartroom_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartroom}
      POSTGRES_USER: ${POSTGRES_USER:-smartroom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks:
      smart_room_net:
        ipv4_address: 172.20.0.10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartroom}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  # ── InfluxDB (séries temporelles IoT) ────────────────────────
  influxdb:
    image: influxdb:2.7-alpine
    container_name: smartroom_influxdb
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USER:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: smart_room
      DOCKER_INFLUXDB_INIT_BUCKET: sensor_data
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN}
      DOCKER_INFLUXDB_INIT_RETENTION: 90d
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    ports:
      - "8086:8086"
    networks:
      smart_room_net:
        ipv4_address: 172.20.0.11
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G

  # ── Redis (cache + pub/sub) ───────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: smartroom_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      smart_room_net:
        ipv4_address: 172.20.0.12
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  # ── Mosquitto MQTT Broker ─────────────────────────────────────
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: smartroom_mosquitto
    restart: unless-stopped
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    ports:
      - "1883:1883"   # MQTT non-TLS (LAN seulement)
      - "8883:8883"   # MQTT TLS
      - "9001:9001"   # WebSocket
    networks:
      smart_room_net:
        ipv4_address: 172.20.0.13
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-i", "healthcheck", "-W", "3"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Backend FastAPI ───────────────────────────────────────────
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      cache_from:
        - smartroom/backend:latest
    container_name: smartroom_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN}
      INFLUXDB_ORG: smart_room
      INFLUXDB_BUCKET: sensor_data
      SECRET_KEY: ${SECRET_KEY}
      MQTT_BROKER: mosquitto
      MQTT_PORT: "8883"
      MQTT_PASSWORD: ${MQTT_BACKEND_PASSWORD}
      ML_SERVICE_URL: http://ml_service:8001
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    networks:
      smart_room_net:
        ipv4_address: 172.20.0.20
    volumes:
      - ./infra/ssl:/app/ssl:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ── ML Service ────────────────────────────────────────────────
  ml_service:
    build:
      context: ../ml_service
      dockerfile: Dockerfile
    container_name: smartroom_ml
    restart: unless-stopped
    environment:
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN}
      INFLUXDB_ORG: smart_room
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_DIR: /app/models
    ports:
      - "8001:8001"
    depends_on:
      influxdb:
        condition: service_healthy
    networks:
      smart_room_net:
        ipv4_address: 172.20.0.21
    volumes:
      - ml_models:/app/models
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2"

  # ── Frontend React (Nginx) ────────────────────────────────────
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:8000}
    container_name: smartroom_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      smart_room_net:
        ipv4_address: 172.20.0.30
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── MLflow Tracking Server ────────────────────────────────────
  mlflow:
    image: python:3.11-slim
    container_name: smartroom_mlflow
    restart: unless-stopped
    command: >
      bash -c "pip install mlflow boto3 psycopg2-binary &&
               mlflow server
               --backend-store-uri postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}_mlflow
               --default-artifact-root /mlflow/artifacts
               --host 0.0.0.0
               --port 5000"
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      smart_room_net:
        ipv4_address: 172.20.0.22

    # ── Prometheus ─────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: smartroom_prometheus
    restart: unless-stopped

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    networks:
      smart_room_net:
        ipv4_address: 172.20.0.23
  # ── Grafana ───────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.2.0
    container_name: smartroom_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-worldmap-panel
      GF_SERVER_ROOT_URL: http://localhost:3001
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infra/monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
      - influxdb
    networks:
      smart_room_net:
        ipv4_address: 172.20.0.41
    deploy:
      resources:
        limits:
          memory: 256M

  # ── Elasticsearch ─────────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: smartroom_elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      smart_room_net:
        ipv4_address: 172.20.0.50
    deploy:
      resources:
        limits:
          memory: 1G

  # ── Kibana ────────────────────────────────────────────────────
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: smartroom_kibana
    restart: unless-stopped
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      smart_room_net:
        ipv4_address: 172.20.0.51
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Nginx Reverse Proxy (prod) ────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: smartroom_nginx
    restart: unless-stopped
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
    networks:
      smart_room_net:
        ipv4_address: 172.20.0.60
    profiles:
      - production
