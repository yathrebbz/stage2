# .github/workflows/ci-cd.yml
# ═══════════════════════════════════════════════════════════════
# Pipeline CI/CD complète — Smart Room & Financial Monitoring
#
# Stages:
#   1. Quality     → Lint + Format (ESLint, Black, Flake8, mypy)
#   2. Test        → Tests unitaires + couverture (pytest, Jest)
#   3. Integration → Tests d'intégration (Testcontainers)
#   4. Build       → Docker multi-stage images
#   5. Security    → Scan vulnérabilités Trivy
#   6. Push        → Docker Hub / GHCR
#   7. Deploy      → Staging → Smoke Tests → Production
#   8. Notify      → Slack notification résultat
#
# Secrets requis (GitHub Settings → Secrets):
#   DOCKER_HUB_USERNAME, DOCKER_HUB_TOKEN
#   STAGING_HOST, STAGING_SSH_KEY
#   PRODUCTION_HOST, PRODUCTION_SSH_KEY
#   SLACK_WEBHOOK_URL
#   SENTRY_AUTH_TOKEN

name: 🚀 CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: "Deploy to environment"
        required: true
        default: "staging"
        type: choice
        options: [staging, production]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/smart-room

# Annule les runs précédents sur la même branche
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ═══════════════════════════════════════════════════════════
  #  STAGE 1 — QUALITY CHECKS
  # ═══════════════════════════════════════════════════════════

  quality-backend:
    name: 🔍 Backend Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install black flake8 mypy isort bandit pylint
          pip install -r backend/requirements.txt

      - name: Black formatting check
        run: black --check --diff backend/

      - name: Flake8 linting
        run: flake8 backend/ --max-line-length=100 --exclude=__pycache__,.venv

      - name: isort import sorting
        run: isort --check-only backend/

      - name: mypy type checking
        run: mypy backend/app/ --ignore-missing-imports --strict

      - name: Bandit security scan (Python)
        run: bandit -r backend/app/ -ll -x backend/tests/

  quality-frontend:
    name: 🔍 Frontend Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: TypeScript type check
        working-directory: frontend
        run: npm run type-check

      - name: Prettier check
        working-directory: frontend
        run: npm run format:check

  # ═══════════════════════════════════════════════════════════
  #  STAGE 2 — UNIT TESTS
  # ═══════════════════════════════════════════════════════════

  test-backend:
    name: 🧪 Backend Tests
    runs-on: ubuntu-latest
    needs: quality-backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: smartroom_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7.2-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt pytest-cov

      - name: Run tests with coverage
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/smartroom_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test_secret_key_for_ci_only
          INFLUXDB_URL: http://localhost:8086
          INFLUXDB_TOKEN: test_token
          INFLUXDB_ORG: test_org
          INFLUXDB_BUCKET: test_bucket
        run: |
          pytest tests/ \
            --cov=app \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            -v \
            --tb=short \
            -x

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: backend/coverage.xml
          flags: backend
          name: backend-coverage

  test-frontend:
    name: 🧪 Frontend Tests
    runs-on: ubuntu-latest
    needs: quality-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Jest tests
        working-directory: frontend
        run: npm test -- --coverage --watchAll=false --ci

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: frontend/coverage/lcov.info
          flags: frontend

  # ═══════════════════════════════════════════════════════════
  #  STAGE 3 — INTEGRATION TESTS
  # ═══════════════════════════════════════════════════════════

  integration-tests:
    name: 🔄 Integration Tests
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt pytest-asyncio httpx

      - name: Start services via Docker Compose
        run: |
          cp .env.example .env
          docker compose -f infra/docker-compose.yml up -d postgres redis influxdb
          sleep 15

      - name: Run integration tests
        working-directory: backend
        run: |
          pytest tests/integration/ \
            -v --tb=short \
            --timeout=60

      - name: Stop services
        if: always()
        run: docker compose -f infra/docker-compose.yml down

  # ═══════════════════════════════════════════════════════════
  #  STAGE 4 — BUILD DOCKER IMAGES
  # ═══════════════════════════════════════════════════════════

  build-images:
    name: 🐳 Build Docker Images
    runs-on: ubuntu-latest
    needs: integration-tests
    if: github.event_name != 'pull_request'
    outputs:
      backend_tag: ${{ steps.meta-backend.outputs.version }}
      frontend_tag: ${{ steps.meta-frontend.outputs.version }}
      ml_tag: ${{ steps.meta-ml.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Backend ──
      - name: Extract metadata (backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      # ── Frontend ──
      - name: Extract metadata (frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── ML Service ──
      - name: Extract metadata (ml)
        id: meta-ml
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/ml-service
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push ML service
        uses: docker/build-push-action@v5
        with:
          context: ./ml_service
          push: true
          tags: ${{ steps.meta-ml.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ═══════════════════════════════════════════════════════════
  #  STAGE 5 — SECURITY SCAN
  # ═══════════════════════════════════════════════════════════

  security-scan:
    name: 🔒 Security Scan (Trivy)
    runs-on: ubuntu-latest
    needs: build-images
    steps:
      - name: Scan backend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:latest"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "1"

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

  # ═══════════════════════════════════════════════════════════
  #  STAGE 6 — DEPLOY STAGING
  # ═══════════════════════════════════════════════════════════

  deploy-staging:
    name: 🚀 Deploy → Staging
    runs-on: ubuntu-latest
    needs: [build-images, security-scan]
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://staging.smartroom.example.com
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Staging via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: deploy
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/smart-room
            git pull origin develop
            
            # Mettre à jour les images
            export BACKEND_TAG=sha-${{ github.sha }}
            export FRONTEND_TAG=sha-${{ github.sha }}
            
            docker compose pull
            docker compose up -d --remove-orphans
            
            # Attendre santé des services
            sleep 30
            docker compose ps

      - name: Smoke Tests (Staging)
        run: |
          sleep 20
          curl -f https://staging.smartroom.example.com/health || exit 1
          curl -f https://staging.smartroom.example.com/api/v1/auth/health || exit 1
          echo "✅ Smoke tests passed"

  # ═══════════════════════════════════════════════════════════
  #  STAGE 7 — DEPLOY PRODUCTION
  # ═══════════════════════════════════════════════════════════

  deploy-production:
    name: 🏭 Deploy → Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://smartroom.example.com
    steps:
      - uses: actions/checkout@v4

      - name: Blue/Green Deployment
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: deploy
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            cd /opt/smart-room
            git pull origin main
            
            # Blue/Green: démarrer green, tester, switcher
            export IMAGE_TAG=sha-${{ github.sha }}
            
            # Déployer nouvelle version
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d \
              --scale backend=2 \
              --no-recreate
            
            # Vérification santé
            sleep 30
            curl -f http://localhost:8000/health || exit 1
            
            echo "✅ Production deployment successful"

      - name: Production Smoke Tests
        run: |
          sleep 30
          curl -f https://smartroom.example.com/health || exit 1
          echo "✅ Production smoke tests passed"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          files: |
            docs/CHANGELOG.md

  # ═══════════════════════════════════════════════════════════
  #  STAGE 8 — NOTIFICATIONS
  # ═══════════════════════════════════════════════════════════

  notify:
    name: 📢 Slack Notification
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production]
    if: always()
    steps:
      - name: Notify Slack
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          fields: repo,message,commit,author,action,eventName,ref,workflow
          text: |
            *Smart Room Deploy* — ${{ github.ref_name }}
            Status: ${{ needs.deploy-production.result == 'success' && '✅ Success' || '❌ Failed' }}
            Commit: ${{ github.sha }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        if: always()
